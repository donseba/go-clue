name: Release editor plugins

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.15.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish all five editor plugins
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GOWORK: 'off'
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH; got $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the checkout matches the tag
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0
        with:
          gradle-version: '9.7.1'
          cache-disabled: true

      - name: Set and check package versions from the tag
        run: |
          bash scripts/set-release-version.sh "$RELEASE_TAG"
          bash scripts/check-release-version.sh "$RELEASE_TAG"

      - name: Test and build all editor packages
        run: bash scripts/build-dist.sh

      - name: Verify package identities, versions, and checksums
        run: python3 scripts/check-dist.py "$RELEASE_TAG"

      - name: Publish packages to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish-github-release.sh "$RELEASE_TAG"
